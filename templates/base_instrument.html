<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}复核 · 素材哨兵{% endblock %}</title>
  <style>
    :root {
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --line: #E4E4DF;
      --ink: #151515;
      --ink-2: #6A6A64;
      --disabled: #9C9C96;
      --accent: #1D4ED8;
      --p0: #C0392B;
      --p1: #C77700;
      --p2: #0F766E;
      --p3: #6A6A64;
      --r: 6px;
      --sans: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
      --ease: ease-out;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
    }
    p, h1, h2, h3 { margin: 0; }
    h1, h2, h3 { font-weight: 600; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 2px; }
    svg { display: block; }
    ::selection { background: var(--accent); color: var(--surface); }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .shell { width: 100%; max-width: 1600px; margin: 0 auto; padding: 0 32px; }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 16px; top: 8px; z-index: 99; background: var(--surface);
      border: 1px solid var(--ink); border-radius: var(--r); padding: 4px 8px; }
    :where(a, button, input, select, textarea, summary):focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* 等级色只作竖条与记号 */
    .lv-P0 { --lv: var(--p0); }
    .lv-P1 { --lv: var(--p1); }
    .lv-P2 { --lv: var(--p2); }
    .lv-P3 { --lv: var(--p3); }

    /* 48px 状态带 */
    .statusbar { position: sticky; top: 0; z-index: 40;
      background: var(--surface); border-bottom: 1px solid var(--line); }
    .statusbar-inner { height: 48px; display: flex; align-items: center; gap: 16px; }
    .brandmark { color: var(--ink); flex: none; }
    .vsep { width: 1px; height: 16px; background: var(--line); flex: none; }
    .sfield { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .slabel { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
    .svalue { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; }
    .levelmark { display: inline-flex; align-items: center; gap: 8px; }
    .levelmark::before { content: ""; width: 3px; height: 12px; background: var(--lv); }
    .strip-btn { margin-left: auto; flex: none; }

    /* 按钮与控件 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 32px; padding: 0 12px; border: 1px solid var(--line);
      border-radius: var(--r); background: var(--surface); color: var(--ink);
      font: 500 14px/1 var(--sans); cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease),
                  color 150ms var(--ease), opacity 150ms var(--ease),
                  transform 150ms var(--ease);
    }
    .btn:hover { background: var(--bg); border-color: var(--ink); text-decoration: none; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { color: var(--disabled); background: var(--surface);
      border-color: var(--line); cursor: not-allowed; transform: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
    .btn.primary:hover { opacity: 0.92; background: var(--accent); border-color: var(--accent); }
    input, select, textarea {
      width: 100%; min-height: 32px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: var(--r);
      background: var(--surface); color: var(--ink);
      font: 14px/1.5 var(--sans);
    }
    textarea { min-height: 64px; padding: 8px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--disabled); }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent);
    }

    /* 页面栅格：左 60% 证据 / 右 40% 信号 */
    .layout {
      display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      grid-template-areas: "source signal" "ledger signal";
      gap: 24px; padding-top: 24px; padding-bottom: 48px;
    }
    .source { grid-area: source; }
    .ledger { grid-area: ledger; scroll-margin-top: 64px; }
    .signal-col { grid-area: signal; }
    .signal-sticky { position: sticky; top: 64px; }

    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
    .panel-head { display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .panel-head h2 { font-size: 14px; }
    .panel-body { padding: 16px; }
    .meta { font-size: 12px; color: var(--ink-2); }
    .note { font-size: 12px; color: var(--ink-2); }
    .statusline { min-height: 16px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
    .empty-line { padding: 8px 0 0; font-size: 12px; color: var(--ink-2); }

    /* 源素材：位置示意 + 时间轴 + 规格 */
    .plate-wrap { padding: 16px 16px 0; }
    .plate {
      position: relative; aspect-ratio: 16 / 9; overflow: hidden;
      border: 1px solid var(--line); border-radius: var(--r);
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 25%),
        repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 25%);
    }
    .bbox { position: absolute; border: 1px solid var(--lv); }
    .bbox-label {
      position: absolute; top: 0; left: 0; padding: 0 4px;
      background: var(--surface); border-right: 1px solid var(--lv);
      border-bottom: 1px solid var(--lv); font-size: 12px; line-height: 1.5;
    }
    .plate-empty {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 12px; color: var(--ink-2);
    }
    .plate-foot { display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 8px 0; font-size: 12px; color: var(--ink-2); }
    .timeline { padding: 0 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: var(--r); font-size: 12px; }
    .track { position: relative; height: 16px; margin-top: 12px; border-top: 1px solid var(--line); }
    .tick { position: absolute; top: -4px; width: 1px; height: 8px; background: var(--ink);
      transform: translateX(-50%); }
    .track-labels { display: flex; justify-content: space-between; gap: 16px;
      margin-top: 4px; font-size: 12px; color: var(--ink-2); }

    /* 授权台账 */
    .kv { margin: 0; }
    .kv > div { display: flex; justify-content: space-between; gap: 16px;
      padding: 8px 0; border-top: 1px solid var(--line); font-size: 12px; }
    .kv dt { color: var(--ink-2); }
    .kv dd { margin: 0; text-align: right; font-family: var(--mono);
      font-variant-numeric: tabular-nums; }
    .record { display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
    .record:first-of-type { margin-top: 8px; }
    .record .scope { font-size: 14px; }
    .record .why { margin-top: 4px; font-size: 12px; color: var(--ink-2); }
    .record-meta { flex: none; text-align: right; }
    .record-meta .mono { font-size: 12px; color: var(--ink-2); }
    .record-meta .status { display: block; margin-top: 4px; font-size: 12px; color: var(--ink); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .controls select { flex: 1; min-width: 200px; font-family: var(--mono); font-size: 12px; }
    .edit { margin-top: 12px; border-top: 1px solid var(--line); }
    .edit summary { padding-top: 12px; font-size: 12px; color: var(--ink-2);
      cursor: pointer; list-style: none; transition: color 150ms var(--ease); }
    .edit summary::-webkit-details-marker { display: none; }
    .edit summary:hover { color: var(--ink); }
    .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field > span { font-size: 12px; color: var(--ink-2); }

    /* 信号卡 */
    .signal { border-left: 3px solid var(--lv); }
    .signal-head { display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .signal-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .signal-level { font-size: 14px; font-weight: 600; }
    .signal-cat { font-size: 14px; }
    .signal-body { padding: 16px; }
    .conf { display: grid; grid-template-columns: auto minmax(64px, 1fr) auto;
      align-items: center; gap: 8px; font-size: 12px; }
    .conf-label { color: var(--ink-2); white-space: nowrap; }
    .conf-track { position: relative; height: 2px; background: var(--line); }
    .conf-track i { position: absolute; left: 0; top: 0; height: 2px; background: var(--ink); }
    .conf-val { min-width: 40px; text-align: right; }
    .conclusion { margin-top: 12px; font-size: 15px; font-weight: 500; }
    .ev-head { display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); }
    .ev-head h3 { font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .ev { list-style: none; margin: 8px 0 0; padding: 0; }
    .ev li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto;
      gap: 8px; align-items: baseline; padding: 8px 0;
      border-top: 1px solid var(--line); font-size: 12px; }
    .ev li:first-child { border-top: 0; }
    .kind { color: var(--ink-2); }
    .ev-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .ref { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
    a.ref:hover { text-decoration: underline; }
    .ev-note { font-size: 12px; color: var(--ink-2); }
    .loc { text-align: right; white-space: nowrap; }
    .decision { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--line); }
    .decision > .label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--ink-2); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    /* 工作台 */
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .page-head { padding-top: 32px; padding-bottom: 24px; }
    .page-head h1 { margin-top: 8px; font-size: 20px; }
    .page-head .lede { margin-top: 8px; max-width: 72ch; font-size: 14px; color: var(--ink-2); }
    .workbench { max-width: 880px; margin: 0 auto; padding-bottom: 48px; }

    .dropzone { display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; min-height: 240px; padding: 24px; border: 1px dashed var(--line);
      border-radius: var(--r); background: var(--bg); cursor: pointer; text-align: center;
      transition: border-color 150ms var(--ease), background-color 150ms var(--ease); }
    .dropzone:hover { border-color: var(--ink); }
    .dropzone.is-drag { border-color: var(--ink); background: var(--surface); }
    .dropzone.is-ready { border-color: var(--accent); }
    .dz-icon { color: var(--ink-2); }
    .dz-title { font-size: 14px; font-weight: 600; }
    .dz-hint { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
    .dz-file { display: inline-flex; align-items: center; max-width: 100%; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
      font-size: 12px; }
    .dz-file[hidden] { display: none; }
    .dz-file .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
    .upload-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 16px; }
    .run-state { min-height: 16px; font-size: 12px; color: var(--ink-2); }
    .pipeline { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 12px 0 0;
      border-top: 1px solid var(--line); list-style: none; }
    .pipeline[hidden] { display: none; }
    .pipeline li { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px;
      border: 1px solid var(--line); border-radius: var(--r); font-size: 12px; color: var(--ink-2); }
    .pipeline li::before { content: ""; width: 6px; height: 6px; background: var(--line); }
    .pipeline li[data-state="active"] { border-color: var(--ink); color: var(--ink); }
    .pipeline li[data-state="active"]::before { background: var(--ink); }
    .pipeline li[data-state="done"]::before { background: var(--ink-2); }

    /* 检测报告 */
    .report { margin-top: 24px; scroll-margin-top: 64px; }
    .report-head { display: flex; flex-wrap: wrap; align-items: flex-start;
      justify-content: space-between; gap: 24px; padding: 16px; }
    .report-title { margin-top: 8px; font-size: 20px; }
    .report-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px;
      font-size: 12px; color: var(--ink-2); }
    .tally { display: flex; overflow: hidden; border: 1px solid var(--line);
      border-radius: var(--r); background: var(--surface); }
    .tally > div { min-width: 64px; padding: 8px 16px; text-align: right;
      border-left: 1px solid var(--line); border-top: 3px solid var(--lv); }
    .tally > div:first-child { border-left: 0; }
    .tally .n { display: block; font-family: var(--mono); font-size: 16px;
      font-weight: 600; line-height: 1.5; }
    .tally .k { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
    .tally .zero .n { color: var(--disabled); }
    .signal-foot { display: flex; justify-content: flex-end; padding: 0 16px 16px; }
    .link-quiet { font-size: 14px; color: var(--ink); }
    .pass { display: flex; align-items: flex-start; gap: 16px; padding: 24px; }
    .pass-icon { display: grid; place-items: center; width: 32px; height: 32px;
      flex: none; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); }
    .pass h3 { font-size: 16px; }
    .pass p { margin-top: 4px; font-size: 12px; color: var(--ink-2); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    /* 页脚 */
    .site-footer { border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; gap: 24px;
      padding-top: 16px; padding-bottom: 32px; font-size: 12px; color: var(--ink-2); }
    .footer-inner .mark { flex: none; }

    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "source" "signal" "ledger";
        gap: 16px; padding-top: 16px; padding-bottom: 32px; }
      .signal-sticky { position: static; }
      .page-head { padding-top: 24px; padding-bottom: 16px; }
      .workbench { padding-bottom: 32px; }
    }
    @media (max-width: 640px) {
      .shell { padding: 0 16px; }
      .statusbar-inner { gap: 12px; }
      .brandmark, .vsep, .hide-sm { display: none; }
      .edit-grid { grid-template-columns: 1fr; }
      .controls { flex-direction: column; align-items: stretch; }
      .controls select { min-width: 0; }
      .record { gap: 8px; }
      .footer-inner { flex-direction: column; gap: 8px; }
      .tally { width: 100%; }
      .tally > div { flex: 1; min-width: 0; padding: 8px; }
      .dropzone { min-height: 184px; padding: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.001ms !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  {% block topbar %}{% endblock %}
  <main id="main" class="shell">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>{{ disclaimer }}</p>
      <span class="mark mono">{% block footer_mark %}ADSENTRY / REVIEW{% endblock %}</span>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
