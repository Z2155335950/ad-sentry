<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}素材哨兵 AdSentry{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --ink: #1f2328; --muted: #667085;
      --line: #e4e7ec; --accent: #2563eb; --p0: #d92d20; --p1: #e8590c;
      --p2: #b7791f; --p3: #2563eb; --ok: #12805c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Microsoft YaHei", sans-serif;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    header.top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; }
    header.top h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
    header.top .sub { color: var(--muted); font-size: 13px; }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 22px; margin-bottom: 16px;
    }
    .btn {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.danger { border-color: #f2b8b5; color: var(--p0); }
    .badge {
      display: inline-block; padding: 1px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 600; color: #fff;
    }
    .badge.P0 { background: var(--p0); } .badge.P1 { background: var(--p1); }
    .badge.P2 { background: var(--p2); } .badge.P3 { background: var(--p3); }
    .muted { color: var(--muted); font-size: 13px; }
    .finding { border-top: 1px solid var(--line); padding: 14px 0; }
    .finding:first-child { border-top: 0; }
    .finding .title { font-weight: 600; margin-bottom: 2px; }
    .ev { margin: 6px 0 0; padding-left: 16px; font-size: 13px; color: #344054; }
    .ev li { margin: 2px 0; }
    footer { margin-top: 28px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    code { background: #f2f4f7; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    a { color: var(--accent); }
    textarea {
      width: 100%; min-height: 72px; border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit; resize: vertical;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, select {
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
      font: inherit; background: #fff; color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="wrap">
    {% block content %}{% endblock %}
    <footer>{{ disclaimer }}</footer>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
