services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/adsentry.db
      DATA_DIR: /app/data
      FIXTURES_DIR: /app/fixtures
      WATCHLISTS_DIR: /app/data/watchlists
      WORKER_IN_APP: "false"
      PYTHONUTF8: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./fixtures:/app/fixtures:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/adsentry.db
      DATA_DIR: /app/data
      FIXTURES_DIR: /app/fixtures
      WATCHLISTS_DIR: /app/data/watchlists
      WORKER_IN_APP: "false"
      PYTHONUTF8: "1"
    volumes:
      - ./data:/app/data
      - ./fixtures:/app/fixtures:ro
    command: python -m app.workers.run
    depends_on:
      - app
