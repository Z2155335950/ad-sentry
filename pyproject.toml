[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-sentry"
version = "0.1.0"
description = "素材哨兵 AdSentry：出海广告素材上线前风险信号筛查"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    # 抽取层（Phase 1）
    "numpy>=1.26",
    "opencv-python>=4.9",
    "scenedetect>=0.6.4",
    "imagehash>=4.3",
    "scipy>=1.11",
    "imageio-ffmpeg>=0.5",
    "rapidocr-onnxruntime>=1.3",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
# 可选：优先使用 PaddleOCR（PROMPT 锁定栈）；装不上时 auto 模式自动用 rapidocr
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
# 可选：Google Vision 用服务账号 JSON 鉴权时需要；用 GOOGLE_VISION_API_KEY 则不需要
vision = ["google-auth>=2.30"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI 的 Depends/File 惯用参数默认值写法
ignore = ["B008"]
